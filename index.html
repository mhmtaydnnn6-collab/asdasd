<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisteme Giriş Yap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .logo-box {
            width: 70px;
            height: 70px;
            background: #e2e8f0;
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }
        .btn-custom {
            background-color: #0f172a;
            color: white;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center">
            <div class="logo-box">
                <i class="fa-solid fa-user-lock fa-2x"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Giriş Yap</h4>
            <p class="text-muted small mb-4">Süreç Takip Sistemine Hoş Geldiniz</p>
        </div>

        <!-- Hata Mesajı Alanı -->
        <div id="errorAlert" class="alert alert-danger d-none py-2 small text-center" role="alert">
            Kullanıcı adı veya şifre hatalı!
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Kullanıcı Adı</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="username" class="form-control border-start-0 bg-light" placeholder="Kullanıcı adınızı girin" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" id="password" class="form-control border-start-0 bg-light" placeholder="Şifrenizi girin" required>
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 mb-3">Sisteme Giriş</button>
        </form>
    </div>

    <script>
        // Yetkili Kullanıcı Listesi ve Şifreleri
        const yetkiliKullanicilar = {
            "EMRE YEŞİLLER": "MAMABULGUR1907",
            "MAHMUT AYDIN": "MAMABULGUR1907",
            "ONUR DUMAN": "MAMABULGUR1907",
            "HAKAN ABİ": "MAMABULGUR1907"
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Girilen metinleri büyük harfe çevirip küçük/büyük harf uyumsuzluğunu önlüyoruz
            const user = document.getElementById('username').value.trim().toUpperCase('tr-TR');
            const pass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            // Kullanıcı kontrolü
            if (yetkiliKullanicilar[user] && yetkiliKullanicilar[user] === pass) {
                errorAlert.classList.add('d-none');
                
                // Giriş yapan kullanıcının adını oturuma kaydediyoruz
                localStorage.setItem('aktifKullanici', user);
                
                // Belirtilen web adresine yönlendirme
                window.location.href = "https://greensstok.online/anamenu"; 
            } else {
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
