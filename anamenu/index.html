<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süreç Takip Sistemi</title>
    
    <!-- GÜVENLİK KONTROLÜ: Sayfa yüklenmeden anında çalışır -->
    <script>
        if (!sessionStorage.getItem('aktifKullanici')) {
            window.location.replace("https://greensstok.online");
        }
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #0f172a;
            --bg-light: #f8fafc;
        }
        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background-color: var(--primary-color);
        }
        .main-container {
            max-width: 900px;
            margin: auto;
        }
        .action-card {
            border: none;
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .action-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.15);
        }
        .icon-box {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Üst Kurumsal Bar -->
    <nav class="navbar navbar-dark navbar-custom shadow-sm py-3">
        <div class="container text-center justify-content-center">
            <span class="navbar-brand mb-0 h1 fw-bold fs-4">
                <i class="fa-solid fa-industry me-2"></i>KOLAY GELSİN HAYIRLI İŞLER
            </span>
        </div>
    </nav>

    <!-- Ana Karşılama Alanı -->
    <div class="container main-container my-auto py-5">
        
        <div class="text-center mb-5">
            <h2 class="fw-bold text-dark mb-2" id="karsilamaMesaji">Hoş Geldiniz</h2>
            <p class="text-muted fs-5">Lütfen işlem yapmak istediğiniz bölümü seçin</p>
        </div>

        <div class="row g-4 justify-content-center">
            
            <!-- Üretim Butonu -->
            <div class="col-md-4 col-sm-6">
                <div class="action-card bg-warning text-dark text-center" onclick="secimYap('Üretim')">
                    <div class="icon-box">
                        <i class="fa-solid fa-gears fa-2x"></i>
                    </div>
                    <h3 class="fw-bold mb-1">ÜRETİM</h3>
                    <p class="small mb-0 opacity-75">Kesim Hattı</p>
                </div>
            </div>

            <!-- Boya Butonu -->
            <div class="col-md-4 col-sm-6">
                <div class="action-card bg-info text-white text-center" onclick="secimYap('Boya')">
                    <div class="icon-box">
                        <i class="fa-solid fa-spray-can fa-2x"></i>
                    </div>
                    <h3 class="fw-bold mb-1">BOYA</h3>
                    <p class="small mb-0 opacity-75">Boya Hattı</p>
                </div>
            </div>

            <!-- Depo Butonu -->
            <div class="col-md-4 col-sm-6">
                <div class="action-card bg-success text-white text-center" onclick="secimYap('Depo')">
                    <div class="icon-box">
                        <i class="fa-solid fa-warehouse fa-2x"></i>
                    </div>
                    <h3 class="fw-bold mb-1">DEPO</h3>
                    <p class="small mb-0 opacity-75">Stok</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Kullanıcı ismini ekrana yazdırma
        const aktifKullanici = sessionStorage.getItem('aktifKullanici');
        if (aktifKullanici) {
            document.getElementById('karsilamaMesaji').innerText = `Hoş Geldiniz, ${aktifKullanici}`;
        }

        function secimYap(bolum) {
            alert(bolum + " bölümü seçildi.");
        }
    </script>
</body>
</html>
